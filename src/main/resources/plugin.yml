name: mEvents
version: ${version}
main: io.github.miklires.mevents.MEventsPlugin
api-version: '26.2'
author: miklires
description: Reliable airdrop and boss event engine
folia-supported: true
softdepend: [mCases, mBadges, mClans, PlaceholderAPI]
libraries:
  - com.h2database:h2:2.3.232
commands:
  event:
    description: Manage server events
    usage: /event <list|status|history|info|start|stop|reload>
    aliases: [events, mevents]
permissions:
  mevents.use: { default: true }
  mevents.admin:
    default: op
    children:
      mevents.use: true
      mevents.reload: true
  mevents.reload: { default: op }
